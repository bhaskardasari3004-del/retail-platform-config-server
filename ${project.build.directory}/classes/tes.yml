server:
  port: 8080

spring:
  application:
    name: retail-platform-api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: lb://RETAIL-APPSERVICES-CUSTOMERS
          predicates:
            - Path=/customers/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    instance-id: API-GATEWAY
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"