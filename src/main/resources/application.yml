server:
  port: 8888

spring:
  application:
    name: retail-platform-config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/bhaskardasari3004-del/retail-platform-config-repo.git
          default-label: Release
          clone-on-start: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance_id: retail-platform-config-server
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: "*"